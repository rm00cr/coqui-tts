[project]
name = "coqui-tts"
version = "0.1.0"
description = "Speaker anonymization for speech, built on Coqui XTTS v2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0",
    "anyascii>=0.3.3",
    "argparse>=1.4.0",
    "bangla>=0.0.5",
    "bnnumerizer>=0.0.2",
    "bnunicodenormalizer>=0.1.7",
    "coqpit>=0.0.17",
    "datasets>=4.4.1",
    "einops>=0.8.1",
    "evaluate>=0.4.6",
    "faster-whisper>=1.2.0",
    "gradio>=5.49.1",
    "gruut>=2.4.0",
    "h5py>=3.15.0",
    "hangul-romanize>=0.1.0",
    "inflect>=7.5.0",
    "jamo>=0.4.1",
    "jieba>=0.42.1",
    "jiwer>=4.0.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.7",
    "mutagen>=1.47.0",
    "nltk>=3.9.2",
    "noisereduce>=3.0.3",
    "numpy==1.26.4",
    "openai-whisper>=20250625",
    "pandas>=2.3.3",
    "pypinyin>=0.55.0",
    "pysbd>=0.3.4",
    "sacrebleu>=2.5.1",
    "soundfile>=0.13.1",
    "spacy>=3.8.7",
    "torch==2.6",
    "torchaudio==2.6.0",
    "trainer>=0.0.36",
    "transformers==4.33",
]

[project.scripts]
anonymize = "anonymizer.cli:main"

# On Windows the PyPI torch wheels are CPU-only, so torch and torchaudio are pulled
# from PyTorch's own CUDA 12.6 index. On Linux the PyPI wheels already bundle CUDA,
# so resolution there is unchanged.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
markers = [
    "slow: needs a GPU and/or downloads extra models; deselect with -m 'not slow'",
]

[tool.setuptools]
# TTS is the upstream Coqui package; anonymizer is the public API for this fork;
# development carries the refinement heuristics anonymizer's "refine" mode calls.
packages = ["TTS", "anonymizer", "development"]

[build-system]
requires = [
"setuptools",
"wheel",
"cython~=0.29.30",
"numpy>=1.22.0",
"packaging",
]
build-backend = "setuptools.build_meta"

[flake8]
max-line-length=120

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
line_length = 120
profile = "black"
